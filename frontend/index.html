<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Mechanics Portal - Customer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Mechanics Safety &amp; Quality Portal</h1>
    <p class="subtitle">Customer Booking &amp; Basic Portal (prototype)</p>
  </header>

  <nav>
    <button data-view="booking" class="nav-btn active">Book a Service</button>
    <button data-view="bookings" class="nav-btn">My Bookings</button>
    <button data-view="history" class="nav-btn">Vehicle History</button>
  </nav>

  <main>
    <!-- Step-based booking flow: select vehicle -> select service+slot -> confirm -->
    <section id="view-booking" class="view active">
      <h2>Book a Service</h2>
      <div class="stepper">
        <span class="step active" data-step="1">1. Vehicle</span>
        <span class="step" data-step="2">2. Service &amp; Slot</span>
        <span class="step" data-step="3">3. Confirm</span>
      </div>

      <div id="step-1" class="step-panel active">
        <label for="vehicle-select">Select your vehicle</label>
        <select id="vehicle-select"></select>
        <button id="to-step-2">Next</button>
      </div>

      <div id="step-2" class="step-panel">
        <label for="service-type">Service type</label>
        <select id="service-type">
          <option value="basic_service">Basic Service</option>
          <option value="full_service">Full Service</option>
          <option value="wof">WOF</option>
        </select>

        <label for="slot-time">Available time slot</label>
        <input type="datetime-local" id="slot-time" />

        <label for="booking-notes">Additional notes</label>
        <textarea id="booking-notes" rows="4" placeholder="Tell us anything we should know about your vehicle or service needs."></textarea>

        <div class="btn-row">
          <button id="back-to-1">Back</button>
          <button id="to-step-3">Next</button>
        </div>
      </div>

      <div id="step-3" class="step-panel">
        <h3>Confirm your booking</h3>
        <p id="confirm-summary"></p>
        <div class="btn-row">
          <button id="back-to-2">Back</button>
          <button id="confirm-booking">Confirm Booking</button>
        </div>
      </div>

      <div id="booking-result"></div>
    </section>

    <!-- My bookings + cancellation -->
    <section id="view-bookings" class="view">
      <h2>My Bookings</h2>
      <div id="bookings-list"></div>
    </section>

    <!-- Vehicle history -->
    <section id="view-history" class="view">
      <h2>Vehicle History</h2>
      <label for="history-vehicle-select">Vehicle</label>
      <select id="history-vehicle-select"></select>
      <div id="history-list"></div>
    </section>
  </main>

  <div id="booking-details-modal" class="modal-backdrop" hidden>
    <section class="booking-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-header">
        <h2 id="modal-title">Booking details</h2>
        <button id="close-modal" class="modal-close" type="button" aria-label="Close booking details">&times;</button>
      </div>
      <div id="modal-content"></div>
    </section>
  </div>

  <script src="app.js"></script>
</body>
</html>
